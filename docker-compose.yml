version: '3.8'

services:
  backend:
    build: ./backend
    container_name: phishing-backend
    
    
    command: uvicorn main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    restart: always

  frontend:
    build: ./frontend/project
    container_name: phishing-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: always